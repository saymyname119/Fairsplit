services:
  - type: web
    name: fairsplit-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: FairSplit <onboarding@resend.dev>
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
