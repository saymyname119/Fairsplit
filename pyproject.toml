[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitwise-clone"
version = "0.1.0"
description = "A Splitwise-style expense splitting app — modular monolith, microservice-ready"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",       # async postgres driver
    "psycopg2-binary>=2.9",  # sync driver (alembic env)

    # Validation / serialization
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Redis
    "redis>=5.0.4",

    # HTTP client (for AI module — Anthropic SDK)
    "httpx>=0.27.0",
    "anthropic>=0.28.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",            # password hashing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",           # TestClient for FastAPI
    "ruff>=0.4.0",             # linter + formatter (replaces flake8, black, isort)
    "mypy>=1.10.0",            # static type checking
    "sqlalchemy[mypy]>=2.0.30",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["modules", "shared", "api"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette TestClient httpx→httpx2 migration notice — third-party, not our code
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["modules", "shared", "api"]
